name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Bundle
        run: pnpm run bundle

      - name: Verify artifact contract
        run: pnpm run verify

      - name: Host smoke
        run: node scripts/smoke.mjs

      - name: Client bundle smoke
        run: node scripts/smoke-client.mjs

      - name: Prompt parity
        run: node scripts/smoke-parity.mjs
